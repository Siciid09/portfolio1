<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import a clean, modern geometric font */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Fallback dark color */
        }

        /* 1. Animated Moving Gradient Background */
        .bg-animated {
            background: linear-gradient(-45deg, #020617, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -2;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. Floating Ambient Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 40vw;
            height: 40vw;
            background: rgba(99, 102, 241, 0.4); /* Indigo glow */
            top: -10vh;
            left: -10vw;
        }

        .orb-2 {
            width: 50vw;
            height: 50vw;
            background: rgba(236, 72, 153, 0.25); /* Pink glow */
            bottom: -20vh;
            right: -10vw;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5vw, 5vh) scale(1.1); }
        }

        /* 3. Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 4. Smooth Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        @keyframes revealUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Gradient Text Utility */
        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex items-center justify-center relative px-6">

    <div class="bg-animated"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card p-10 md:p-16 lg:p-20 rounded-3xl max-w-3xl w-full text-center z-10 flex flex-col items-center reveal">
        
        <h1 class="text-8xl md:text-[12rem] font-black leading-none tracking-tighter text-gradient reveal delay-1 drop-shadow-2xl mb-4">
            404
        </h1>
        
        <h2 class="text-2xl md:text-4xl font-bold mb-6 tracking-tight text-white reveal delay-2">
            Lost in the digital void
        </h2>
        
        <p class="text-slate-400 text-base md:text-lg max-w-lg mb-10 reveal delay-3 leading-relaxed">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back to familiar territory.
        </p>
        
        <a href="/" class="reveal delay-3 group relative inline-flex items-center justify-center px-8 py-4 text-base font-bold text-white transition-all duration-300 bg-white/10 border border-white/20 rounded-full hover:bg-white/20 hover:shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:-translate-y-1 backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white/50 focus:ring-offset-[#0f172a]">
            <span>Return to Homepage</span>
            <svg class="w-5 h-5 ml-3 transition-transform duration-300 group-hover:translate-x-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
        </a>
        
    </div>

</body>
</html>
